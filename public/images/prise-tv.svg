<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="20" y="20" width="360" height="260" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Wall Plate Frame -->
  <g filter="url(#shadow)">
    <!-- Outer Frame -->
    <rect x="110" y="55" width="180" height="180" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
    <!-- Inner outlet area -->
    <rect x="135" y="80" width="130" height="130" rx="8" fill="#ffffff" stroke="#f1f5f9" stroke-width="2" />
  </g>
  
  <!-- Screws -->
  <circle cx="125" cy="145" r="3" fill="#94a3b8" />
  <line x1="123" y1="145" x2="127" y2="145" stroke="#475569" stroke-width="1" />
  
  <circle cx="275" cy="145" r="3" fill="#94a3b8" />
  <line x1="273" y1="145" x2="277" y2="145" stroke="#475569" stroke-width="1" />

  <!-- Connectors -->
  <!-- TV Connector (Male IEC) -->
  <circle cx="170" cy="115" r="16" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
  <circle cx="170" cy="115" r="11" fill="#ffffff" />
  <circle cx="170" cy="115" r="4.5" fill="#cbd5e1" />
  <circle cx="170" cy="115" r="1.5" fill="#0f172a" />
  <text x="170" y="142" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle" font-weight="bold">TV</text>

  <!-- SAT Connector (F-Type Female Threaded) -->
  <circle cx="200" cy="170" r="14" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
  <circle cx="200" cy="170" r="8" fill="#94a3b8" />
  <circle cx="200" cy="170" r="2" fill="#0f172a" />
  <!-- Threads lines -->
  <line x1="192" y1="170" x2="208" y2="170" stroke="#475569" stroke-width="0.5" />
  <line x1="200" y1="162" x2="200" y2="178" stroke="#475569" stroke-width="0.5" />
  <text x="200" y="195" font-family="sans-serif" font-size="8" fill="#ef4444" text-anchor="middle" font-weight="bold">SAT</text>

  <!-- FM Connector (Female IEC) -->
  <circle cx="230" cy="115" r="16" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
  <circle cx="230" cy="115" r="11" fill="#ffffff" />
  <circle cx="230" cy="115" r="8" fill="#cbd5e1" />
  <circle cx="230" cy="115" r="5" fill="#ffffff" />
  <text x="230" y="142" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle" font-weight="bold">FM</text>

  <text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">TV / FM / SAT TRI-PORT OUTLET</text>
</svg>