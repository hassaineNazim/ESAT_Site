<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="20" y="20" width="360" height="260" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Hospital Building -->
  <g filter="url(#shadow)">
    <!-- Main Block -->
    <rect x="70" y="90" width="140" height="140" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
    <!-- Red Cross Badge -->
    <rect x="125" y="105" width="30" height="30" rx="6" fill="#ffffff" />
    <path d="M 140 110 L 140 130 M 130 120 L 150 120" stroke="#ef4444" stroke-width="6" stroke-linecap="round" />
    <!-- Windows -->
    
        <rect x="85" y="155" width="25" height="20" rx="1" fill="#475569" />
      

        <rect x="130" y="155" width="25" height="20" rx="1" fill="#475569" />
      

        <rect x="175" y="155" width="25" height="20" rx="1" fill="#475569" />
      

        <rect x="85" y="190" width="25" height="20" rx="1" fill="#475569" />
      

        <rect x="130" y="190" width="25" height="20" rx="1" fill="#475569" />
      

        <rect x="175" y="190" width="25" height="20" rx="1" fill="#475569" />
      
  </g>
  
  <!-- Headend / Antenna distribution -->
  <g filter="url(#shadow)">
    <rect x="250" y="100" width="80" height="100" rx="6" fill="#1e293b" />
    <!-- Screen -->
    <rect x="258" y="112" width="64" height="30" rx="2" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
    <!-- Waves -->
    <path d="M 270 127 L 278 122 L 285 132 L 295 118 L 302 127" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
    
    <!-- Coax distributions ports -->
    <circle cx="265" cy="165" r="5" fill="#475569" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="290" cy="165" r="5" fill="#475569" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="315" cy="165" r="5" fill="#475569" stroke="#cbd5e1" stroke-width="1" />
  </g>
  
  <!-- Distribution Cables -->
  <path d="M 250 165 C 220 165, 230 180, 210 180" stroke="#475569" stroke-width="3" fill="none" />
  <path d="M 250 165 C 220 165, 230 215, 210 215" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="3,2" />

  <text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">HOSPITAL TV HEADEND &amp; COAX DISTRIBUTION</text>
</svg>