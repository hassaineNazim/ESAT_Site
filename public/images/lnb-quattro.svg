<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="20" y="20" width="360" height="260" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Feedhorn / Cap -->
  <g filter="url(#shadow)">
    <!-- Cap -->
    <ellipse cx="140" cy="110" rx="20" ry="35" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
    <ellipse cx="140" cy="110" rx="6" ry="18" fill="#94a3b8" />
    
    <!-- Waveguide neck -->
    <path d="M 140 90 L 220 105 L 220 135 L 140 130 Z" fill="#cbd5e1" />
    
    <!-- LNB Body -->
    <rect x="210" y="80" width="90" height="80" rx="8" fill="#475569" />
    <rect x="215" y="85" width="80" height="70" rx="5" fill="#1e293b" />
  </g>
  
  <!-- Output ports HH, HL, VH, VL -->
  
        <!-- Coax connector out -->
        <rect x="225" y="160" width="8" height="15" fill="#94a3b8" stroke="#334155" stroke-width="1" />
        <circle cx="229" cy="177" r="1" fill="#ffffff" />
        <!-- Small label -->
        <text x="229" y="190" font-family="sans-serif" font-size="6" fill="#94a3b8" text-anchor="middle" font-weight="bold">
          H/H
        </text>
      

        <!-- Coax connector out -->
        <rect x="243" y="160" width="8" height="15" fill="#94a3b8" stroke="#334155" stroke-width="1" />
        <circle cx="247" cy="177" r="1" fill="#ffffff" />
        <!-- Small label -->
        <text x="247" y="190" font-family="sans-serif" font-size="6" fill="#94a3b8" text-anchor="middle" font-weight="bold">
          H/L
        </text>
      

        <!-- Coax connector out -->
        <rect x="261" y="160" width="8" height="15" fill="#94a3b8" stroke="#334155" stroke-width="1" />
        <circle cx="265" cy="177" r="1" fill="#ffffff" />
        <!-- Small label -->
        <text x="265" y="190" font-family="sans-serif" font-size="6" fill="#94a3b8" text-anchor="middle" font-weight="bold">
          V/H
        </text>
      

        <!-- Coax connector out -->
        <rect x="279" y="160" width="8" height="15" fill="#94a3b8" stroke="#334155" stroke-width="1" />
        <circle cx="283" cy="177" r="1" fill="#ffffff" />
        <!-- Small label -->
        <text x="283" y="190" font-family="sans-serif" font-size="6" fill="#94a3b8" text-anchor="middle" font-weight="bold">
          V/L
        </text>
      
  
  <!-- Feedhorn support clamp (shadowed representation) -->
  <rect x="175" y="125" width="18" height="40" rx="2" fill="#64748b" opacity="0.6" />
  
  <text x="200" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">PROFESSIONAL QUATTRO LNB</text>
</svg>