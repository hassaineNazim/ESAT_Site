<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="20" y="20" width="360" height="260" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Receiver Body -->
  <g filter="url(#shadow)">
    <rect x="90" y="60" width="220" height="170" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
    <rect x="95" y="65" width="210" height="160" rx="6" fill="#f1f5f9" />
  </g>

  <!-- Fiber Cable Input -->
  <!-- Yellow Fiber Cable Jacket -->
  <path d="M 200 20 L 200 65" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none" />
  <!-- SC/APC Connector green -->
  <rect x="187" y="65" width="26" height="25" rx="3" fill="#10b981" stroke="#047857" stroke-width="1.5" />
  <circle cx="200" cy="80" r="4" fill="#ffffff" />
  
  <!-- Internal Circuits (Technical Schematic Overlay) -->
  <path d="M 200 90 L 200 115" stroke="#475569" stroke-width="2" stroke-dasharray="3,3" />
  <!-- Optical Photodiode symbol -->
  <circle cx="200" cy="125" r="12" fill="#ffffff" stroke="#ef4444" stroke-width="2" />
  <path d="M 194 125 L 206 125 M 200 119 L 200 131" stroke="#ef4444" stroke-width="1.5" />
  
  <!-- Split Paths -->
  <path d="M 200 137 L 200 160 L 150 160 L 150 190" stroke="#475569" stroke-width="2" fill="none" />
  <path d="M 200 160 L 250 160 L 250 190" stroke="#475569" stroke-width="2" fill="none" />
  
  <!-- RF Coax Connectors Out -->
  <circle cx="150" cy="205" r="10" fill="#475569" stroke="#94a3b8" stroke-width="2" />
  <circle cx="150" cy="205" r="3" fill="#cbd5e1" />
  <path d="M 150 215 L 150 230" stroke="#94a3b8" stroke-width="4" />
  
  <circle cx="250" cy="205" r="10" fill="#475569" stroke="#94a3b8" stroke-width="2" />
  <circle cx="250" cy="205" r="3" fill="#cbd5e1" />
  <path d="M 250 215 L 250 230" stroke="#94a3b8" stroke-width="4" />
  
  <!-- Indicator Lights -->
  <circle cx="115" cy="90" r="5.5" fill="#10b981" />
  <text x="127" y="93" font-family="sans-serif" font-size="8" fill="#475569" font-weight="bold">OPT IN</text>
  
  <circle cx="115" cy="110" r="5.5" fill="#10b981" />
  <text x="127" y="113" font-family="sans-serif" font-size="8" fill="#475569" font-weight="bold">PWR</text>
  
  <text x="200" y="265" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">FTTH OPTICAL RECEIVER</text>
</svg>