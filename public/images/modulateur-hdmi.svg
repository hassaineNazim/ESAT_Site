<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="20" y="20" width="360" height="260" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Modulator Body -->
  <g filter="url(#shadow)">
    <rect x="80" y="70" width="240" height="160" rx="8" fill="#1e293b" />
    <rect x="85" y="75" width="230" height="150" rx="6" fill="#334155" />
  </g>
  
  <!-- Display Screen -->
  <rect x="105" y="95" width="90" height="50" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
  <!-- Screen Text -->
  <text x="115" y="115" font-family="monospace" font-size="10" fill="#10b981" font-weight="bold">HDMI -> DVB-T</text>
  <text x="115" y="132" font-family="monospace" font-size="9" fill="#10b981">CH: E37 QAM64</text>
  
  <!-- Status LEDs -->
  <circle cx="225" cy="105" r="4" fill="#10b981" />
  <text x="235" y="108" font-family="sans-serif" font-size="8" fill="#94a3b8" font-weight="bold">LOCK</text>
  
  <circle cx="225" cy="120" r="4" fill="#ef4444" />
  <text x="235" y="123" font-family="sans-serif" font-size="8" fill="#94a3b8" font-weight="bold">SIG</text>

  <circle cx="225" cy="135" r="4" fill="#10b981" />
  <text x="235" y="138" font-family="sans-serif" font-size="8" fill="#94a3b8" font-weight="bold">PWR</text>
  
  <!-- Navigation Buttons -->
  <circle cx="285" cy="105" r="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
  <path d="M 285 102 L 285 108 M 282 105 L 288 105" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  
  <circle cx="285" cy="130" r="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
  <path d="M 282 130 L 288 130" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Ports (HDMI & Coax) -->
  <rect x="110" y="175" width="35" height="15" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1" />
  <text x="127.5" y="186" font-family="sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle" font-weight="bold">HDMI</text>
  
  <rect x="155" y="175" width="35" height="15" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1" />
  <text x="172.5" y="186" font-family="sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle" font-weight="bold">USB</text>
  
  <!-- Coax Port Out -->
  <circle cx="250" cy="182" r="10" fill="#475569" stroke="#94a3b8" stroke-width="2" />
  <circle cx="250" cy="182" r="4" fill="#cbd5e1" />
  <circle cx="250" cy="182" r="1.5" fill="#0f172a" />
  <text x="250" y="207" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle" font-weight="bold">RF OUT</text>
  
  <text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">HDMI TO DVB-T MODULATOR</text>
</svg>