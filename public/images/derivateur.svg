<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="20" y="20" width="360" height="260" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Splitter metallic body -->
  <g filter="url(#shadow)">
    <!-- Main Trapezoid box -->
    <path d="M 120 90 L 280 90 L 300 190 L 100 190 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
    <path d="M 125 95 L 275 95 L 290 185 L 110 185 Z" fill="#e2e8f0" />
  </g>
  
  <!-- Mounting tabs -->
  <rect x="80" y="130" width="20" height="15" rx="3" fill="#94a3b8" />
  <circle cx="90" cy="137.5" r="4" fill="#ffffff" stroke="#475569" stroke-width="1.5" />
  
  <rect x="300" y="130" width="20" height="15" rx="3" fill="#94a3b8" />
  <circle cx="310" cy="137.5" r="4" fill="#ffffff" stroke="#475569" stroke-width="1.5" />

  <!-- Inputs / Outputs -->
  <!-- IN (Top) -->
  <rect x="190" y="70" width="20" height="20" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
  <circle cx="200" cy="65" r="2" fill="#cbd5e1" />
  <text x="200" y="110" font-family="sans-serif" font-size="8" fill="#475569" font-weight="bold" text-anchor="middle">IN</text>
  
  <!-- OUT (Bottom Direct) -->
  <rect x="190" y="190" width="20" height="20" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
  <circle cx="200" cy="215" r="2" fill="#cbd5e1" />
  <text x="200" y="180" font-family="sans-serif" font-size="8" fill="#475569" font-weight="bold" text-anchor="middle">OUT</text>
  
  <!-- Taps (Bottom angled / standard) -->
  
        <!-- Tap Connector -->
        <rect x="120" y="190" width="14" height="25" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
        <circle cx="127" cy="220" r="1.5" fill="#cbd5e1" />
        <text x="127" y="175" font-family="sans-serif" font-size="8" fill="#ef4444" font-weight="bold" text-anchor="middle">-15dB</text>
        <text x="127" y="235" font-family="sans-serif" font-size="8" fill="#64748b" font-weight="bold" text-anchor="middle">TAP 1</text>
      

        <!-- Tap Connector -->
        <rect x="173" y="190" width="14" height="25" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
        <circle cx="180" cy="220" r="1.5" fill="#cbd5e1" />
        <text x="180" y="175" font-family="sans-serif" font-size="8" fill="#ef4444" font-weight="bold" text-anchor="middle">-15dB</text>
        <text x="180" y="235" font-family="sans-serif" font-size="8" fill="#64748b" font-weight="bold" text-anchor="middle">TAP 2</text>
      

        <!-- Tap Connector -->
        <rect x="226" y="190" width="14" height="25" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
        <circle cx="233" cy="220" r="1.5" fill="#cbd5e1" />
        <text x="233" y="175" font-family="sans-serif" font-size="8" fill="#ef4444" font-weight="bold" text-anchor="middle">-15dB</text>
        <text x="233" y="235" font-family="sans-serif" font-size="8" fill="#64748b" font-weight="bold" text-anchor="middle">TAP 3</text>
      

        <!-- Tap Connector -->
        <rect x="279" y="190" width="14" height="25" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
        <circle cx="286" cy="220" r="1.5" fill="#cbd5e1" />
        <text x="286" y="175" font-family="sans-serif" font-size="8" fill="#ef4444" font-weight="bold" text-anchor="middle">-15dB</text>
        <text x="286" y="235" font-family="sans-serif" font-size="8" fill="#64748b" font-weight="bold" text-anchor="middle">TAP 4</text>
      

  <text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">4-WAY TAP / DERIVATEUR 15dB</text>
</svg>