<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="20" y="20" width="360" height="260" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Hotel Building -->
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="120" height="150" rx="4" fill="#1e293b" />
    <!-- Windows and screens inside -->
    
        <rect x="95" y="95" width="30" height="25" rx="2" fill="#38bdf8" opacity="0.8" />
        <polygon points="105,105 115,113 105,120" fill="#ffffff" />
      

        <rect x="145" y="95" width="30" height="25" rx="2" fill="#38bdf8" opacity="0.8" />
        <polygon points="155,105 165,113 155,120" fill="#ffffff" />
      

        <rect x="95" y="135" width="30" height="25" rx="2" fill="#38bdf8" opacity="0.8" />
        <polygon points="105,145 115,153 105,160" fill="#ffffff" />
      

        <rect x="145" y="135" width="30" height="25" rx="2" fill="#38bdf8" opacity="0.8" />
        <polygon points="155,145 165,153 155,160" fill="#ffffff" />
      

        <rect x="95" y="175" width="30" height="25" rx="2" fill="#38bdf8" opacity="0.8" />
        <polygon points="105,185 115,193 105,200" fill="#ffffff" />
      

        <rect x="145" y="175" width="30" height="25" rx="2" fill="#38bdf8" opacity="0.8" />
        <polygon points="155,185 165,193 155,200" fill="#ffffff" />
      
  </g>
  
  <!-- Stars -->
  
    <polygon points="100,60 103,66 110,66 105,70 107,76 100,72 93,76 95,70 90,66 97,66" fill="#fbbf24" />
  

    <polygon points="120,60 123,66 130,66 125,70 127,76 120,72 113,76 115,70 110,66 117,66" fill="#fbbf24" />
  

    <polygon points="140,60 143,66 150,66 145,70 147,76 140,72 133,76 135,70 130,66 137,66" fill="#fbbf24" />
  

    <polygon points="160,60 163,66 170,66 165,70 167,76 160,72 153,76 155,70 150,66 157,66" fill="#fbbf24" />
  

    <polygon points="180,60 183,66 190,66 185,70 187,76 180,72 173,76 175,70 170,66 177,66" fill="#fbbf24" />
  
  
  <!-- IPTV Server & Signal link -->
  <g filter="url(#shadow)">
    <rect x="240" y="110" width="80" height="90" rx="6" fill="#0f172a" />
    <!-- Server slots -->
    <rect x="245" y="120" width="70" height="15" rx="2" fill="#1e293b" />
    <circle cx="255" cy="127.5" r="2.5" fill="#10b981" />
    <rect x="265" y="125" width="40" height="5" rx="1" fill="#475569" />
    
    <rect x="245" y="145" width="70" height="15" rx="2" fill="#1e293b" />
    <circle cx="255" cy="152.5" r="2.5" fill="#10b981" />
    <rect x="265" y="150" width="40" height="5" rx="1" fill="#ef4444" />
    
    <rect x="245" y="170" width="70" height="15" rx="2" fill="#1e293b" />
    <circle cx="255" cy="177.5" r="2.5" fill="#ef4444" />
    <rect x="265" y="175" width="40" height="5" rx="1" fill="#475569" />
  </g>
  
  <!-- Network Connection Waves -->
  <path d="M 210 150 L 230 150" stroke="#ef4444" stroke-width="3" stroke-dasharray="4,3" />
  <circle cx="205" cy="150" r="4" fill="#ef4444" />
  <circle cx="235" cy="150" r="4" fill="#ef4444" />
  
  <text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">HOTEL IPTV SYSTEM DEPLOYMENT</text>
</svg>