<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="20" y="20" width="360" height="260" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Metallic Body -->
  <g filter="url(#shadow)">
    <rect x="100" y="90" width="200" height="110" rx="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
    <rect x="105" y="95" width="190" height="100" rx="4" fill="#e2e8f0" />
  </g>
  
  <!-- RF Connectors (Left / Right) -->
  <!-- IN -->
  <rect x="75" y="130" width="25" height="16" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
  <circle cx="70" cy="138" r="2.5" fill="#cbd5e1" />
  <text x="115" y="142" font-family="sans-serif" font-size="9" fill="#475569" font-weight="bold">INPUT</text>
  
  <!-- OUT -->
  <rect x="300" y="130" width="25" height="16" fill="#94a3b8" stroke="#475569" stroke-width="1.5" />
  <circle cx="330" cy="138" r="2.5" fill="#cbd5e1" />
  <text x="285" y="142" font-family="sans-serif" font-size="9" fill="#475569" font-weight="bold" text-anchor="end">OUTPUT</text>
  
  <!-- Adjustment Dial -->
  <circle cx="200" cy="140" r="20" fill="#475569" stroke="#1e293b" stroke-width="2" />
  <!-- Pointer -->
  <line x1="200" y1="140" x2="200" y2="124" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="200" cy="140" r="3" fill="#ffffff" />
  <text x="200" y="175" font-family="sans-serif" font-size="8" fill="#475569" text-anchor="middle" font-weight="bold">GAIN ADJUST (30dB)</text>
  
  <!-- Highlighting Signal Boost Arrow -->
  <path d="M 130 80 Q 200 40 270 80" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4" />
  <path d="M 265 80 L 275 80 L 270 70 Z" fill="#ef4444" />
  <text x="200" y="55" font-family="sans-serif" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="bold">AMPLIFICATION +30dB</text>

  <text x="200" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">BIS LINE AMPLIFIER</text>
</svg>