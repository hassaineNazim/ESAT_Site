<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="20" y="20" width="360" height="260" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Central Amplifier Body -->
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="260" height="150" rx="8" fill="#1e293b" />
    <rect x="75" y="75" width="250" height="140" rx="6" fill="#0f172a" />
  </g>

  <!-- Programmable Display Screen -->
  <rect x="95" y="95" width="110" height="60" rx="4" fill="#0284c7" stroke="#0ea5e9" stroke-width="2" />
  <!-- Screen detail -->
  <text x="105" y="115" font-family="monospace" font-size="10" fill="#ffffff" font-weight="bold">ESAT CENTRALE</text>
  <text x="105" y="132" font-family="monospace" font-size="9" fill="#e0f2fe">UHF: 32 FILTERS</text>
  <text x="105" y="148" font-family="monospace" font-size="9" fill="#22c55e">AUTO LEVEL: ON</text>
  
  <!-- Programming Buttons -->
  <circle cx="245" cy="110" r="10" fill="#334155" stroke="#475569" stroke-width="1" />
  <path d="M 245 106 L 245 114" stroke="#ffffff" stroke-width="1.5" />
  <path d="M 241 110 L 249 110" stroke="#ffffff" stroke-width="1.5" />
  
  <circle cx="280" cy="110" r="10" fill="#334155" stroke="#475569" stroke-width="1" />
  <path d="M 276 110 L 284 110" stroke="#ffffff" stroke-width="1.5" />

  <circle cx="262.5" cy="135" r="8" fill="#ef4444" stroke="#b91c1c" stroke-width="1" />
  <text x="262.5" y="138" font-family="sans-serif" font-size="7" fill="#ffffff" text-anchor="middle" font-weight="bold">OK</text>
  
  <!-- Multi RF Inputs / Outputs -->
  <!-- Inputs -->
  
        <rect x="110" y="185" width="10" height="15" fill="#475569" stroke="#cbd5e1" stroke-width="1" />
        <circle cx="115" cy="203" r="1.5" fill="#ffffff" />
      

        <rect x="135" y="185" width="10" height="15" fill="#475569" stroke="#cbd5e1" stroke-width="1" />
        <circle cx="140" cy="203" r="1.5" fill="#ffffff" />
      

        <rect x="160" y="185" width="10" height="15" fill="#475569" stroke="#cbd5e1" stroke-width="1" />
        <circle cx="165" cy="203" r="1.5" fill="#ffffff" />
      

        <rect x="185" y="185" width="10" height="15" fill="#475569" stroke="#cbd5e1" stroke-width="1" />
        <circle cx="190" cy="203" r="1.5" fill="#ffffff" />
      
  <text x="145" y="180" font-family="sans-serif" font-size="7" fill="#64748b" text-anchor="middle" font-weight="bold">UHF/VHF INPUTS</text>
  
  <!-- Output -->
  <rect x="250" y="185" width="12" height="15" fill="#475569" stroke="#cbd5e1" stroke-width="1" />
  <circle cx="256" cy="203" r="1.5" fill="#ffffff" />
  <text x="256" y="180" font-family="sans-serif" font-size="7" fill="#ef4444" text-anchor="middle" font-weight="bold">RF OUT</text>
  
  <text x="200" y="255" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">PROGRAMMABLE CENTRAL AMPLIFIER</text>
</svg>