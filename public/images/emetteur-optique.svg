<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="20" y="20" width="360" height="260" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Device Chassis -->
  <g filter="url(#shadow)">
    <rect x="60" y="90" width="280" height="120" rx="6" fill="#1e293b" />
    <rect x="65" y="95" width="270" height="110" rx="4" fill="#0f172a" />
  </g>
  
  <!-- Heat Sink Cooling Fins -->
  <line x1="80" y1="120" x2="80" y2="180" stroke="#334155" stroke-width="2" />
<line x1="86" y1="120" x2="86" y2="180" stroke="#334155" stroke-width="2" />
<line x1="92" y1="120" x2="92" y2="180" stroke="#334155" stroke-width="2" />
<line x1="98" y1="120" x2="98" y2="180" stroke="#334155" stroke-width="2" />
<line x1="104" y1="120" x2="104" y2="180" stroke="#334155" stroke-width="2" />
<line x1="110" y1="120" x2="110" y2="180" stroke="#334155" stroke-width="2" />
<line x1="116" y1="120" x2="116" y2="180" stroke="#334155" stroke-width="2" />

  <!-- Laser Indicator Warning Symbol -->
  <polygon points="145,160 155,142 165,160" fill="#f59e0b" />
  <path d="M 155 149 L 155 154" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  <circle cx="155" cy="157" r="1" fill="#0f172a" />
  <text x="155" y="175" font-family="sans-serif" font-size="7" fill="#94a3b8" text-anchor="middle" font-weight="bold">LASER 1550nm</text>

  <!-- Fiber Optic Output Port -->
  <rect x="205" y="130" width="35" height="25" rx="3" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5" />
  <!-- SC/APC Green Connector Body -->
  <rect x="212" y="135" width="21" height="15" fill="#10b981" rx="1" />
  <circle cx="222.5" cy="142.5" r="3" fill="#ffffff" />
  <!-- Laser Beam Beam Line (Invisible/Technical representation) -->
  <path d="M 222.5 142.5 L 300 142.5" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" />
  <path d="M 300 135 L 315 142.5 L 300 150 Z" fill="#ef4444" />
  
  <!-- Status Screen -->
  <rect x="250" y="110" width="70" height="35" rx="3" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
  <text x="255" y="125" font-family="monospace" font-size="9" fill="#93c5fd" font-weight="bold">P: +9.0 dBm</text>
  <text x="255" y="138" font-family="monospace" font-size="8" fill="#10b981">TEMP: 38.5 C</text>

  <text x="200" y="250" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">1550nm OPTICAL TRANSMITTER</text>
</svg>