<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="20" y="20" width="360" height="260" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Coaxial Layers (Stepped Cross-Section Diagram) -->
  <g filter="url(#shadow)">
    <!-- Layer 1: Outer PVC Jacket (White) -->
    <rect x="40" y="100" width="100" height="100" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    <path d="M 140 100 L 140 200" stroke="#e2e8f0" stroke-width="4" />
    
    <!-- Layer 2: Braided Shielding (Silver/Grey) -->
    <rect x="140" y="112" width="70" height="76" fill="#94a3b8" />
    <!-- Braided pattern -->
    <path d="M 140 112 L 210 188 M 140 188 L 210 112 M 160 112 L 210 166 M 140 134 L 190 188 M 180 112 L 140 156" stroke="#475569" stroke-width="1.5" opacity="0.4" />
    
    <!-- Layer 3: Foil Shielding (Shiny Silver) -->
    <rect x="210" y="122" width="50" height="56" fill="#cbd5e1" />
    <rect x="210" y="122" width="10" height="56" fill="#94a3b8" opacity="0.5" />
    
    <!-- Layer 4: Dielectric Insulator (Translucent/White-Grey) -->
    <rect x="260" y="132" width="50" height="36" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Layer 5: Copper Core (Bright Copper Orange) -->
    <rect x="310" y="145" width="50" height="10" fill="#ea580c" rx="2" />
    <rect x="310" y="145" width="50" height="4" fill="#f97316" rx="1" />
  </g>
  
  <!-- Labels and Leader Lines -->
  <g font-family="sans-serif" font-size="8" fill="#64748b" font-weight="bold">
    <!-- Copper Core -->
    <line x1="335" y1="150" x2="335" y2="75" stroke="#ef4444" stroke-width="1" />
    <circle cx="335" cy="150" r="2" fill="#ef4444" />
    <text x="335" y="65" text-anchor="middle">COPPER CORE (1.13mm)</text>
    
    <!-- Dielectric -->
    <line x1="285" y1="150" x2="285" y2="235" stroke="#475569" stroke-width="1" />
    <circle cx="285" cy="150" r="2" fill="#475569" />
    <text x="285" y="247" text-anchor="middle">PE DIELECTRIC</text>
    
    <!-- Shielding -->
    <line x1="180" y1="150" x2="180" y2="75" stroke="#475569" stroke-width="1" />
    <circle cx="180" cy="150" r="2" fill="#475569" />
    <text x="180" y="65" text-anchor="middle">DOUBLE SHIELD (FOIL + BRAID)</text>
    
    <!-- PVC Jacket -->
    <line x1="90" y1="150" x2="90" y2="235" stroke="#475569" stroke-width="1" />
    <circle cx="90" cy="150" r="2" fill="#475569" />
    <text x="90" y="247" text-anchor="middle">OUTER PVC JACKET</text>
  </g>

  <text x="200" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">17 VATC COAXIAL CABLE</text>
</svg>