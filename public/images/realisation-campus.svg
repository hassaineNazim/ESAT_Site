<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#64748b" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="20" y="20" width="360" height="260" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Campus Buildings -->
  <!-- Building 1 -->
  <g filter="url(#shadow)">
    <polygon points="50,220 100,160 150,220" fill="#1e293b" />
    <rect x="70" y="190" width="60" height="30" fill="#334155" />
    <!-- Pillars -->
    <line x1="80" y1="200" x2="80" y2="220" stroke="#cbd5e1" stroke-width="4" />
    <line x1="100" y1="200" x2="100" y2="220" stroke="#cbd5e1" stroke-width="4" />
    <line x1="120" y1="200" x2="120" y2="220" stroke="#cbd5e1" stroke-width="4" />
  </g>
  
  <!-- Building 2 -->
  <g filter="url(#shadow)">
    <rect x="270" y="120" width="80" height="100" rx="4" fill="#475569" />
    
        <rect x="285" y="135" width="15" height="15" rx="1" fill="#38bdf8" />
      

        <rect x="315" y="135" width="15" height="15" rx="1" fill="#38bdf8" />
      

        <rect x="285" y="160" width="15" height="15" rx="1" fill="#38bdf8" />
      

        <rect x="315" y="160" width="15" height="15" rx="1" fill="#38bdf8" />
      

        <rect x="285" y="185" width="15" height="15" rx="1" fill="#38bdf8" />
      

        <rect x="315" y="185" width="15" height="15" rx="1" fill="#38bdf8" />
      
  </g>
  
  <!-- Optical fiber transmitter in the middle -->
  <g filter="url(#shadow)">
    <circle cx="200" cy="110" r="30" fill="#0f172a" />
    <!-- Fiber optic logo -->
    <path d="M 185 110 A 15 15 0 0 1 215 110" fill="none" stroke="#ef4444" stroke-width="3" />
    <circle cx="200" cy="110" r="6" fill="#10b981" />
  </g>
  
  <!-- Fiber Lines Glowing -->
  <path d="M 185 125 C 150 145, 120 160, 100 180" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <circle cx="100" cy="180" r="5" fill="#ef4444" />
  
  <path d="M 215 125 C 240 140, 260 145, 270 145" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" fill="none" />
  <circle cx="270" cy="145" r="5" fill="#ef4444" />

  <text x="200" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" letter-spacing="1">CAMPUS FIBER OPTIC DEPLOYMENT</text>
</svg>